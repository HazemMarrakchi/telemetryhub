name: telemetryhub

services:
  # ===================== Infrastructure =====================
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: th-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: telemetryhub
      POSTGRES_PASSWORD: telemetryhub-dev
      POSTGRES_DB: telemetryhub
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetryhub -d telemetryhub"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.8
    container_name: th-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_SOCKET_REQUEST_MAX_BYTES: 1048576000
      KAFKA_CFG_MESSAGE_MAX_BYTES: 1048576000
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  init-topics:
    image: bitnami/kafka:3.8
    container_name: th-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.raw --partitions 12 --replication-factor 1;
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.anomaly --partitions 6 --replication-factor 1;
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.alerts --partitions 6 --replication-factor 1;
      echo 'Topics created';
      exit 0;
      "
    restart: "no"

  redis:
    image: redis:7.2-alpine
    container_name: th-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===================== Services =====================
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: th-auth-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  fleet-service:
    build:
      context: ./backend
      dockerfile: fleet-service/Dockerfile
    container_name: th-fleet-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  ingestion-service:
    build:
      context: ./backend
      dockerfile: ingestion-service/Dockerfile
    container_name: th-ingestion-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"

  alerting-service:
    build:
      context: ./backend
      dockerfile: alerting-service/Dockerfile
    container_name: th-alerting-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"

  reports-service:
    build:
      context: ./backend
      dockerfile: reports-service/Dockerfile
    container_name: th-reports-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"

  gateway-service:
    build:
      context: ./backend
      dockerfile: gateway-service/Dockerfile
    container_name: th-gateway-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: th-ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: th-simulator
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "-m", "app.main"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: th-frontend
    restart: unless-stopped
    depends_on:
      - gateway-service
    ports:
      - "4200:80"

volumes:
  pg-data:
  kafka-data: