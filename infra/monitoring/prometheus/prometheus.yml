global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "telemetryhub-auth"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]
        labels:
          service: auth-service
  - job_name: "telemetryhub-fleet"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fleet-service:8082"]
        labels:
          service: fleet-service
  - job_name: "telemetryhub-ingestion"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ingestion-service:8083"]
        labels:
          service: ingestion-service
  - job_name: "telemetryhub-alerting"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["alerting-service:8084"]
        labels:
          service: alerting-service
  - job_name: "telemetryhub-reports"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["reports-service:8085"]
        labels:
          service: reports-service
  - job_name: "telemetryhub-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]
        labels:
          service: gateway-service