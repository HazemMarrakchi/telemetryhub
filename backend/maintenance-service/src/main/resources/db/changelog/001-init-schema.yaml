databaseChangeLog:
  - changeSet:
      id: 001-init-maintenance
      author: telemetryhub
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS maintenance;
        - createTable:
            schemaName: maintenance
            tableName: work_orders
            remarks: Ordres de travail CMMS
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: equipment_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2000)
                  constraints:
                    nullable: true
              - column:
                  name: priority
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: assigned_to_user_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: alert_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: due_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: maintenance
            tableName: work_orders
            indexName: idx_wo_tenant_status
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: status
        - createIndex:
            schemaName: maintenance
            tableName: work_orders
            indexName: idx_wo_tenant_equipment
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: equipment_id
        - createTable:
            schemaName: maintenance
            tableName: downtime_events
            remarks: Evenements de temps d'arret
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: equipment_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: alert_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: metric
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: VARCHAR(2000)
                  constraints:
                    nullable: true
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: ended_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: work_order_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: maintenance
            tableName: downtime_events
            indexName: idx_downtime_tenant_equipment
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: equipment_id
        - createIndex:
            schemaName: maintenance
            tableName: downtime_events
            indexName: idx_downtime_tenant_alert
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: alert_id