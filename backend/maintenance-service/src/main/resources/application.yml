spring:
  application:
    name: maintenance-service
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetryhub
    username: telemetryhub
    password: telemetryhub-dev
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: maintenance-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.telemetryhub.maintenance.*"
        spring.json.value.default.type: com.telemetryhub.maintenance.service.AlertMessage
      auto-offset-reset: earliest

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

telemetryhub:
  jwt:
    issuer: telemetryhub-auth
    secret: ${JWT_SECRET:TELEMETRYHUB_DEV_SECRET_KEY_CHANGE_ME_IN_PRODUCTION_0123456789}
  security:
    allowed-origins: http://localhost:4200
  kafka:
    alerts-topic: telemetry.alerts

logging:
  level:
    com.telemetryhub.maintenance: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/telemetryhub
    username: telemetryhub
    password: telemetryhub-dev
  liquibase:
    default-schema: maintenance
  kafka:
    bootstrap-servers: kafka:9092
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:maintenancedb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS maintenance
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9999
telemetryhub:
  jwt:
    secret: TEST_SECRET_KEY_THAT_IS_AT_LEAST_32_BYTES_LONG_FOR_TESTS