databaseChangeLog:
  - changeSet:
      id: 001-init-metrics
      author: telemetryhub
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS metrics;
        - createTable:
            schemaName: metrics
            tableName: metric_catalog
            remarks: "Catalogue des métriques connues"
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: unit
                  type: VARCHAR(24)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: data_type
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    defaultValue: DOUBLE

        - createTable:
            schemaName: metrics
            tableName: telemetry_readings
            remarks: "Mesures brutes (hypertable TimescaleDB)"
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: equipment_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: metric
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: value
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: unit
                  type: VARCHAR(24)
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(64)
              - column:
                  name: device_fingerprint
                  type: VARCHAR(128)
            primaryKey:
              constraintName: telemetry_readings_pkey
              columns:
                - column:
                    name: id
                - column:
                    name: recorded_at

  - changeSet:
      id: 002-timescale-hypertable
      author: telemetryhub
      changes:
        - sql:
            comment: "Convertit telemetry_readings en hypertable TimescaleDB (chunk journalier, compression auto après 7 jours)"
            sql: |
              SELECT create_hypertable('metrics.telemetry_readings', 'recorded_at', chunk_time_interval => INTERVAL '1 day', migrate_data => true, if_not_exists => true);
              ALTER TABLE metrics.telemetry_readings SET (
                timescaledb.compress,
                timescaledb.compress_segmentby = 'tenant_id,equipment_id'
              );
              SELECT add_compression_policy('metrics.telemetry_readings', INTERVAL '7 days', if_not_exists => true);

  - changeSet:
      id: 003-metrics-indexes
      author: telemetryhub
      changes:
        - createIndex:
            schemaName: metrics
            tableName: telemetry_readings
            indexName: idx_readings_tenant_time
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: recorded_at
        - createIndex:
            schemaName: metrics
            tableName: telemetry_readings
            indexName: idx_readings_equipment_time
            columns:
              - column:
                  name: equipment_id
              - column:
                  name: recorded_at

  - changeSet:
      id: 004-seed-metric-catalog
      author: telemetryhub
      context: seed
      changes:
        - sql:
            sql: |
              INSERT INTO metrics.metric_catalog (id, name, unit, description, data_type) VALUES
                ('10000000-0000-0000-0000-000000000001', 'temperature', '°C', 'Température moteur / process', 'DOUBLE'),
                ('10000000-0000-0000-0000-000000000002', 'vibration', 'mm/s', 'Niveau de vibration RMS', 'DOUBLE'),
                ('10000000-0000-0000-0000-000000000003', 'pression', 'bar', 'Pression process', 'DOUBLE'),
                ('10000000-0000-0000-0000-000000000004', 'debit', 'm3/h', 'Débit volumique', 'DOUBLE'),
                ('10000000-0000-0000-0000-000000000005', 'puissance', 'kW', 'Puissance consommée', 'DOUBLE'),
                ('10000000-0000-0000-0000-000000000006', 'courant', 'A', 'Courant absorbé', 'DOUBLE'),
                ('10000000-0000-0000-0000-000000000007', 'tension', 'V', 'Tension alimentation', 'DOUBLE'),
                ('10000000-0000-0000-0000-000000000008', 'humidite', '%', 'Humidité relative', 'DOUBLE')
              ON CONFLICT (id) DO NOTHING;
