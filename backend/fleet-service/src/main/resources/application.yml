spring:
  application:
    name: fleet-service
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetryhub
    username: telemetryhub
    password: telemetryhub-dev
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

telemetryhub:
  jwt:
    issuer: telemetryhub-auth
    secret: ${JWT_SECRET:TELEMETRYHUB_DEV_SECRET_KEY_CHANGE_ME_IN_PRODUCTION_0123456789}
  security:
    allowed-origins: http://localhost:4200

logging:
  level:
    com.telemetryhub.fleet: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/telemetryhub
    username: telemetryhub
    password: telemetryhub-dev
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:fleetdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
telemetryhub:
  jwt:
    secret: TEST_SECRET_KEY_THAT_IS_AT_LEAST_32_BYTES_LONG_FOR_TESTS