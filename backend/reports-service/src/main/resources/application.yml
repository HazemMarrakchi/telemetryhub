spring:
  application:
    name: reports-service
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetryhub
    username: telemetryhub
    password: telemetryhub-dev
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 50MB

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

telemetryhub:
  jwt:
    issuer: telemetryhub-auth
    secret: ${JWT_SECRET:TELEMETRYHUB_DEV_SECRET_KEY_CHANGE_ME_IN_PRODUCTION_0123456789}
  security:
    allowed-origins: http://localhost:4200
  reports:
    retention-days: 30
    bucket-seconds: 300

logging:
  level:
    com.telemetryhub.reports: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/telemetryhub
    username: telemetryhub
    password: telemetryhub-dev
  liquibase:
    default-schema: reports
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:reportsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS reports
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
telemetryhub:
  jwt:
    secret: TEST_SECRET_KEY_THAT_IS_AT_LEAST_32_BYTES_LONG_FOR_TESTS