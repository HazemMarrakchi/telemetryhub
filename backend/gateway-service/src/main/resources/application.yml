spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:4200
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            exposed-headers: "Content-Disposition"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/tenants/**,/api/v1/users/**
          filters:
            - RewritePath=/api/v1/users(?<segment>/?.*), /api/v1/auth/users${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@tenantKeyResolver}"
        - id: fleet-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/models/**,/api/v1/sites/**,/api/v1/equipments/**,/api/v1/maintenance/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                key-resolver: "#{@tenantKeyResolver}"
        - id: ingestion-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/telemetry/**,/api/v1/ingestion/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 200
                redis-rate-limiter.burstCapacity: 400
                key-resolver: "#{@tenantKeyResolver}"
        - id: alerting-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/alerts/**,/api/v1/rules/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                key-resolver: "#{@tenantKeyResolver}"
        - id: reports-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@tenantKeyResolver}"
        - id: maintenance-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/work-orders/**,/api/v1/downtime/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                key-resolver: "#{@tenantKeyResolver}"
        - id: ai-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/ai/**,/api/v1/assistant/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@tenantKeyResolver}"
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  gateway:
    enabled: true

telemetryhub:
  jwt:
    issuer: telemetryhub-auth
    secret: ${JWT_SECRET:TELEMETRYHUB_DEV_SECRET_KEY_CHANGE_ME_IN_PRODUCTION_0123456789}

logging:
  level:
    com.telemetryhub.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
