name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile all modules
        run: mvn -B -f backend/pom.xml compile
      - name: Run unit & integration tests
        run: mvn -B -f backend/pom.xml test
      - name: Package (skip tests, already run)
        run: mvn -B -f backend/pom.xml package -DskipTests
      - name: Verify code coverage report
        run: mvn -B -f backend/pom.xml jacoco:report

  build-frontend:
    name: Frontend (Angular 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Chrome for Karma tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npx ng lint
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
      - name: Production build
        run: npx ng build --configuration=production

  check-python:
    name: Python services (simulator / ai-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulator deps
        working-directory: simulator
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint simulator (ruff)
        working-directory: simulator
        run: ruff check .
      - name: Run simulator unit tests
        working-directory: simulator
        run: python -m pytest -v
      - name: Install ai-service deps
        working-directory: ai-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint ai-service (ruff)
        working-directory: ai-service
        run: ruff check .
      - name: Run ai-service unit tests
        working-directory: ai-service
        run: python -m pytest -v

  docker-compose-validation:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate monitoring compose file
        run: docker compose -f infra/monitoring/docker-compose.monitoring.yml config --quiet

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.10.0
      - name: Lint Helm chart
        run: helm lint infra/k8s/helm/telemetryhub
      - name: Template Helm chart
        run: helm template telemetryhub infra/k8s/helm/telemetryhub > /tmp/chart.yaml

  terraform-fmt:
    name: Terraform format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive